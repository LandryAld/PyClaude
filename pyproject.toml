[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyclaude-studio"
version = "1.0.0"
description = "Atelier scientifique et créatif modulaire en Python/Tkinter : fractales, tableur, 3D, physique, réseau de neurones…"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Natural Language :: French",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
rapide = ["numpy"]

[project.gui-scripts]
pyclaude-studio = "pyclaude_studio.__main__:main"

[tool.setuptools.packages.find]
include = ["pyclaude_studio*"]
